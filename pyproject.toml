[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-engineering-core"
version = "0.1.0"
description = "Núcleo de engenharia agêntica supervisionada"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "PyYAML>=6,<7"]

[project.scripts]
aec = "aec.operations.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.6",
    "types-PyYAML>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aec.documentation" = ["templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
